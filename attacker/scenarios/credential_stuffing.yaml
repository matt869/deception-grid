# Credential stuffing against SSH.
#
# Many distinct usernames paired with common passwords, submitted fast. This is
# list-driven — a stolen credential dump replayed — rather than guessing one
# account, so it is what the credential_stuffing rule (15+ distinct usernames in
# 30 minutes) and the ssh_bruteforce rule (20+ attempts in 10 minutes) are for.
#
# Runs in SSH fingerprint mode: the sensor records the client banner and HASSH
# and cannot see the passwords, which is the honest limitation of not completing
# the crypto handshake. Point this at the telnet scenario if you want the
# sensor to actually capture the credential pairs.

name: credential_stuffing
service: ssh
description: List-driven SSH credential stuffing (fingerprinted, not captured)
rate_per_second: 30
count: 40
client_banner: "SSH-2.0-libssh2_1.10.0"

usernames:
  - root
  - admin
  - administrator
  - user
  - test
  - ubuntu
  - oracle
  - postgres
  - mysql
  - ftp
  - guest
  - support
  - deploy
  - git
  - jenkins
  - nagios
  - zabbix
  - elastic
  - operator
  - backup

passwords:
  - "123456"
  - password
  - admin
  - root
  - "12345678"
  - qwerty
  - changeme
  - "P@ssw0rd"
