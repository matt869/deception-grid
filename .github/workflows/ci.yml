name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Run tests
        # PYTHONPATH so the packages import without an editable install.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  smoke:
    name: End-to-end smoke (seed + detect + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Seed, detect, and probe the API
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m tools.seed_fake_data --attackers 40 --days 7 --seed 7
          python -m honeypot.main --check
          # Boot the API, wait for health, hit a few endpoints, tear down.
          uvicorn api.main:app --port 8000 &
          API_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break || sleep 1
          done
          curl -sf "http://127.0.0.1:8000/api/stats/summary?hours=336" > /dev/null
          curl -sf "http://127.0.0.1:8000/api/attackers?limit=5" > /dev/null
          curl -sf "http://127.0.0.1:8000/api/alerts?limit=5" > /dev/null
          kill $API_PID

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Test (vitest)
        working-directory: dashboard
        run: npm test

      - name: Build
        working-directory: dashboard
        run: npm run build
