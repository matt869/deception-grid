# Full stack: honeypot sensor, API, dashboard, and a Postgres datastore.
#
#   docker compose up --build
#   → dashboard  http://localhost:8080
#   → api docs   http://localhost:8000/docs
#   → sensor     ports 2222/2323/2121/8081/6379/3306
#
# The sensor's ports are published so you can point traffic (or the test client)
# at them. To take real internet traffic, map low ports at the host, e.g.
# add "22:2222" — but never run any of this on infrastructure you don't own.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: honeypot
      POSTGRES_PASSWORD: honeypot
      POSTGRES_DB: honeypot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeypot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sensor:
    build:
      context: .
      dockerfile: honeypot/Dockerfile
    environment:
      DATABASE_URL: postgresql://honeypot:honeypot@db:5432/honeypot
      HONEYPOT_PERSONA: ubuntu-generic
      SENSOR_NAME: docker-sensor
    ports:
      - "2222:2222"   # ssh
      - "2323:2323"   # telnet
      - "2121:2121"   # ftp
      - "8081:8081"   # http
      # Redis and MySQL bait already listen on their real ports inside the
      # container, so these map straight through. If you run a real Redis or
      # MySQL on this host, change the left-hand side — or the bind fails.
      - "6379:6379"   # redis
      - "3306:3306"   # mysql
      # Docker API bait. The sensor never talks to a real daemon and the host's
      # own docker socket is never mounted — this only listens.
      - "2375:2375"   # docker
    volumes:
      # Captured artefacts and the generated SSH host key live under /app/data.
      # Without this volume both are lost the moment the container is recreated
      # — and a captured dropper is the one thing here that cannot be recreated.
      - sensor_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://honeypot:honeypot@db:5432/honeypot
      # The dashboard is served same-origin via nginx, so the browser never
      # calls the API cross-origin; no permissive CORS needed.
      API_CORS_ORIGINS: http://localhost:8080
    volumes:
      # Read-only view of the payload store so `python -m pipeline.analysis.store`
      # can run in the container that has the database. The analyser needs both
      # the bytes and somewhere to put the results, and only the sensor writes
      # here — hence ro.
      - sensor_data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  sensor_data:
